[project]
name = "pubmed-pipeline"
version = "0.1.0"
description = "End-to-end pipeline mapping endometriosis treatment evidence from PubMed literature"
requires-python = ">=3.11"
dependencies = [
    "dagster>=1.13.0",
    "dagster-postgres>=0.29.0",
    "dagster-webserver>=1.13.0",
    "litellm>=1.60.0",
    "pydantic>=2.7.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.30",
    "requests>=2.31.0",
    "lxml>=5.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pubmed_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
