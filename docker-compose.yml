services:
  postgresql:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DAGSTER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DAGSTER_POSTGRES_PASSWORD}
      POSTGRES_DB: ${DAGSTER_POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DAGSTER_POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  dagster_webserver:
    build: .
    entrypoint:
      - dagster-webserver
      - -h
      - "0.0.0.0"
      - -p
      - "3000"
      - -w
      - workspace.yaml
    ports:
      - "3000:3000"
    env_file: .env
    volumes:
      - ./src:/app/src
      - pipeline_data:/app/data
    depends_on:
      postgresql:
        condition: service_healthy

  dagster_daemon:
    build: .
    entrypoint:
      - dagster-daemon
      - run
    env_file: .env
    volumes:
      - ./src:/app/src
      - pipeline_data:/app/data
    depends_on:
      postgresql:
        condition: service_healthy

  dashboard:
    build: ./dashboard
    ports:
      - "8501:8501"
    env_file: .env
    volumes:
      - ./dashboard/app:/app/app
    depends_on:
      postgresql:
        condition: service_healthy

volumes:
  postgres_data:
  pipeline_data:
