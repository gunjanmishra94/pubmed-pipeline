[project]
name = "pubmed-dashboard"
version = "0.1.0"
description = "Streamlit dashboard for the endometriosis PubMed pipeline"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
    "pandas>=2.2.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.30",
    "pyvis>=0.3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
