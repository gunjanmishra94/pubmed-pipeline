services:
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ollama_init:
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["ollama", "pull", "gemma3:4b"]
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: "no"

  dagster_webserver:
    depends_on:
      ollama:
        condition: service_healthy

  dagster_daemon:
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_data:
